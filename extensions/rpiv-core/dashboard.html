<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pi Mission Control</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b12;
      --panel: #101622;
      --panel-2: #151d2c;
      --muted: #95a3b8;
      --text: #eef4ff;
      --line: #263449;
      --blue: #60a5fa;
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
      --purple: #a78bfa;
      --cyan: #22d3ee;
      --shadow: 0 24px 80px rgba(0, 0, 0, .35);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 12% 0%, rgba(96, 165, 250, .18), transparent 34rem),
        radial-gradient(circle at 84% 8%, rgba(167, 139, 250, .16), transparent 30rem),
        linear-gradient(180deg, #080b12 0%, #0b1020 100%);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 28px clamp(18px, 4vw, 44px) 18px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
    }
    h1, h2, h3 { margin: 0; line-height: 1.1; }
    h1 { font-size: clamp(30px, 5vw, 56px); letter-spacing: -.05em; }
    h2 { font-size: 20px; letter-spacing: -.02em; }
    h3 { font-size: 15px; color: #dbeafe; }
    p { color: var(--muted); line-height: 1.55; }
    .subhead { max-width: 860px; margin: 12px 0 0; font-size: 16px; }
    .shell { padding: 0 clamp(18px, 4vw, 44px) 44px; display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 18px; }
    .panel { background: rgba(16, 22, 34, .86); border: 1px solid rgba(148, 163, 184, .14); border-radius: 22px; box-shadow: var(--shadow); backdrop-filter: blur(16px); }
    .sidebar { padding: 14px; height: fit-content; position: sticky; top: 14px; }
    .mission-list { display: grid; gap: 10px; margin-top: 14px; }
    .mission-card { width: 100%; text-align: left; color: inherit; background: var(--panel-2); border: 1px solid var(--line); border-radius: 16px; padding: 14px; cursor: pointer; transition: .18s ease; }
    .mission-card:hover, .mission-card.active { border-color: rgba(96, 165, 250, .75); transform: translateY(-1px); }
    .mission-card strong { display: block; font-size: 14px; margin-bottom: 8px; }
    .meta { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 999px; background: rgba(148, 163, 184, .12); color: #dbeafe; font-size: 12px; border: 1px solid rgba(148, 163, 184, .16); }
    .chip.done { color: #bbf7d0; background: rgba(34, 197, 94, .13); border-color: rgba(34, 197, 94, .32); }
    .chip.blocked { color: #fecaca; background: rgba(239, 68, 68, .13); border-color: rgba(239, 68, 68, .32); }
    .chip.active { color: #bfdbfe; background: rgba(96, 165, 250, .13); border-color: rgba(96, 165, 250, .32); }
    .main { display: grid; gap: 18px; }
    .hero { padding: 22px; display: grid; gap: 18px; }
    .hero-top { display: grid; grid-template-columns: minmax(0, 1fr) 170px; gap: 18px; align-items: start; }
    .goal { font-size: clamp(24px, 3vw, 38px); letter-spacing: -.04em; }
    .progress-ring { aspect-ratio: 1; border-radius: 999px; display: grid; place-items: center; background: conic-gradient(var(--green) calc(var(--pct) * 1%), rgba(148, 163, 184, .14) 0); position: relative; }
    .progress-ring::after { content: ""; position: absolute; inset: 12px; background: var(--panel); border-radius: inherit; }
    .progress-ring span { position: relative; z-index: 1; font-weight: 800; font-size: 32px; letter-spacing: -.05em; }
    .next-input { border-radius: 18px; padding: 18px; border: 1px solid rgba(245, 158, 11, .35); background: linear-gradient(135deg, rgba(245, 158, 11, .15), rgba(96, 165, 250, .08)); }
    .next-input .label { color: #fde68a; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; font-weight: 800; }
    .commands { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    code, .cmd { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
    .cmd { border: 1px solid rgba(251, 191, 36, .28); background: rgba(0, 0, 0, .23); color: #fffbeb; border-radius: 12px; padding: 8px 10px; font-size: 13px; user-select: all; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .stat { padding: 14px; border-radius: 16px; background: var(--panel-2); border: 1px solid var(--line); }
    .stat b { display: block; font-size: 24px; letter-spacing: -.04em; }
    .stat span { color: var(--muted); font-size: 12px; }
    .stages { padding: 18px; }
    .stage-rail { display: grid; grid-template-columns: repeat(8, minmax(130px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 6px; }
    .stage { min-height: 152px; padding: 13px; border-radius: 16px; background: rgba(21, 29, 44, .8); border: 1px solid var(--line); position: relative; }
    .stage.current { border-color: var(--amber); box-shadow: 0 0 0 1px rgba(245, 158, 11, .18), 0 16px 40px rgba(245, 158, 11, .08); }
    .stage.done-stage { border-color: rgba(34, 197, 94, .35); }
    .stage small { display: block; color: var(--muted); margin-top: 8px; line-height: 1.45; }
    .stage .num { width: 24px; height: 24px; display: inline-grid; place-items: center; border-radius: 50%; background: rgba(96, 165, 250, .18); color: #bfdbfe; font-size: 12px; margin-bottom: 10px; }
    .two-col { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(280px, .85fr); gap: 18px; }
    .section { padding: 18px; }
    .features { display: grid; gap: 10px; margin-top: 14px; }
    .feature { padding: 13px; border-radius: 14px; border: 1px solid var(--line); background: rgba(21, 29, 44, .72); }
    .feature-row { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .feature-title { font-weight: 700; }
    .feature small { display: block; color: var(--muted); margin-top: 7px; }
    .activity { display: grid; gap: 12px; margin-top: 14px; }
    .activity-item { border-left: 3px solid var(--blue); padding: 4px 0 4px 12px; color: var(--muted); }
    .empty { padding: 28px; text-align: center; color: var(--muted); }
    .error { padding: 18px; border: 1px solid rgba(239, 68, 68, .35); border-radius: 18px; background: rgba(239, 68, 68, .1); color: #fecaca; }
    @media (max-width: 980px) { .shell, .two-col, .hero-top { grid-template-columns: 1fr; } .sidebar { position: static; } .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .progress-ring { max-width: 170px; } }
    @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } header { display: block; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Pi Mission Control</h1>
      <p class="subhead">Visual dashboard for long-running missions. The highlighted box always shows the exact user input expected to move the selected mission forward.</p>
    </div>
    <span class="chip active" id="refreshState">Live polling: 3s</span>
  </header>
  <div class="shell">
    <aside class="panel sidebar">
      <h2>Missions</h2>
      <p>Project-local state from <code>.pi/missions</code>.</p>
      <div id="missionList" class="mission-list"></div>
    </aside>
    <main class="main" id="app"><div class="panel empty">Loading mission state…</div></main>
  </div>
  <script>
    const stages = [
      ['draft', 'Contract', 'Edit validation-contract.md and replace placeholder VC assertions.'],
      ['draft', 'Approval', 'Review the contract and approve it with /mission-approve.'],
      ['planning', 'Planning', 'Use orchestrator or add features until the backlog is explicit.'],
      ['implementation', 'Implementation', 'Run the worker for the active feature.'],
      ['handoff', 'Handoff', 'Worker records what changed, evidence, commands, and leftovers.'],
      ['validation', 'Validation', 'Run validators and user-style QA against the contract.'],
      ['repair', 'Repair', 'Create corrective follow-ups for failed validations.'],
      ['done', 'Done', 'No input pending. Mission is complete.'],
    ];
    let selectedId = null;
    let allMissions = { missions: [], activeMissionId: undefined };

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function chipStatus(status) {
      const cls = status === 'done' ? 'done' : status === 'blocked' ? 'blocked' : ['in_progress','in_validation'].includes(status) ? 'active' : '';
      return `<span class="chip ${cls}">${esc(status)}</span>`;
    }
    function renderMissionList() {
      const el = document.getElementById('missionList');
      if (!allMissions.missions.length) {
        el.innerHTML = '<div class="empty">No missions yet. Run <code>/mission-new &lt;goal&gt;</code>.</div>';
        return;
      }
      el.innerHTML = allMissions.missions.map((m) => `
        <button class="mission-card ${m.id === selectedId ? 'active' : ''}" data-id="${esc(m.id)}">
          <strong>${esc(m.goal)}</strong>
          <div class="meta">${chipStatus(m.stage)}<span class="chip">${m.progress.percent}%</span><span class="chip">${m.progress.done}/${m.progress.total} done</span></div>
        </button>
      `).join('');
      el.querySelectorAll('button[data-id]').forEach((btn) => btn.addEventListener('click', () => { selectedId = btn.dataset.id; loadSelected(); }));
    }
    function stageClass(stageKey, currentStage, idx) {
      if (stageKey === currentStage) return 'current';
      const currentIndex = stages.findIndex(([key]) => key === currentStage);
      return idx < currentIndex ? 'done-stage' : '';
    }
    function renderMission(m) {
      const commands = m.expectedInput.commands.length
        ? m.expectedInput.commands.map((cmd) => `<span class="cmd">${esc(cmd)}</span>`).join('')
        : '<span class="chip done">No command needed</span>';
      document.getElementById('app').innerHTML = `
        <section class="panel hero">
          <div class="hero-top">
            <div>
              <div class="meta">${chipStatus(m.stage)}${chipStatus(m.status)}${m.approved ? '<span class="chip done">approved</span>' : '<span class="chip blocked">needs approval</span>'}</div>
              <h2 class="goal">${esc(m.goal)}</h2>
              <p><code>${esc(m.id)}</code> · Updated ${esc(new Date(m.updatedAt).toLocaleString())}</p>
            </div>
            <div class="progress-ring" style="--pct:${m.progress.percent}"><span>${m.progress.percent}%</span></div>
          </div>
          <div class="next-input">
            <div class="label">Next expected user input</div>
            <p>${esc(m.expectedInput.description)}</p>
            <div class="commands">${commands}</div>
          </div>
          <div class="grid">
            <div class="stat"><b>${m.progress.total}</b><span>Total features</span></div>
            <div class="stat"><b>${m.progress.done}</b><span>Done</span></div>
            <div class="stat"><b>${m.progress.pending}</b><span>Pending</span></div>
            <div class="stat"><b>${m.progress.blocked}</b><span>Blocked</span></div>
          </div>
        </section>
        <section class="panel stages">
          <h2>Mission stages</h2>
          <p>Each stage states the human input or agent command needed to advance.</p>
          <div class="stage-rail">${stages.map(([key, title, help], idx) => `
            <div class="stage ${stageClass(key, m.stage, idx)}">
              <span class="num">${idx + 1}</span>
              <h3>${esc(title)}</h3>
              <small>${esc(help)}</small>
            </div>
          `).join('')}</div>
        </section>
        <div class="two-col">
          <section class="panel section">
            <h2>Features</h2>
            <div class="features">${m.features.length ? m.features.map((f) => `
              <div class="feature">
                <div class="feature-row"><div class="feature-title">${esc(f.id)} — ${esc(f.title)}</div>${chipStatus(f.status)}</div>
                <small>Milestone ${esc(f.milestone)}${f.isRepair ? ' · repair follow-up' : ''}${f.assertions.length ? ' · Assertions: ' + esc(f.assertions.join(', ')) : ''}</small>
              </div>
            `).join('') : '<div class="empty">No features planned yet.</div>'}</div>
          </section>
          <section class="panel section">
            <h2>Latest activity</h2>
            <div class="activity">
              <div class="activity-item"><strong>Active feature:</strong> ${m.activeFeature ? esc(m.activeFeature.id + ' — ' + m.activeFeature.title) : 'none'}</div>
              <div class="activity-item"><strong>Blockers:</strong> ${m.blockers.length ? esc(m.blockers.map((b) => b.id).join(', ')) : 'none'}</div>
              <div class="activity-item"><strong>Latest handoff:</strong> ${m.latestHandoff ? esc(m.latestHandoff.id + ' for ' + m.latestHandoff.featureId) : 'none'}</div>
              <div class="activity-item"><strong>Latest validation:</strong> ${m.latestValidation ? esc(m.latestValidation.id + ' ' + m.latestValidation.status + ' — ' + m.latestValidation.summary) : 'none'}</div>
              <div class="activity-item"><strong>Contract:</strong> <code>${esc(m.contractPath)}</code></div>
            </div>
          </section>
        </div>
      `;
    }
    async function loadAll() {
      const res = await fetch('/api/missions');
      allMissions = await res.json();
      if (!selectedId) selectedId = allMissions.activeMissionId || allMissions.missions[0]?.id;
      renderMissionList();
      await loadSelected(false);
    }
    async function loadSelected(rerenderList = true) {
      if (!selectedId) { document.getElementById('app').innerHTML = '<div class="panel empty">No active mission. Run <code>/mission-new &lt;goal&gt;</code>.</div>'; return; }
      try {
        const res = await fetch('/api/missions/' + encodeURIComponent(selectedId));
        if (!res.ok) throw new Error(await res.text());
        const mission = await res.json();
        renderMission(mission);
        if (rerenderList) renderMissionList();
      } catch (err) {
        document.getElementById('app').innerHTML = `<div class="error">${esc(err.message || err)}</div>`;
      }
    }
    loadAll().catch((err) => { document.getElementById('app').innerHTML = `<div class="error">${esc(err.message || err)}</div>`; });
    setInterval(loadAll, 3000);
  </script>
</body>
</html>
